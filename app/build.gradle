plugins {
    id 'com.android.application'
}

// 签名信息从 keystore.properties 读，绝不写进仓库。
// 没这个文件时走 debug 签名（本地调试够用），但 release 上架必须提供。
def keystorePropsFile = rootProject.file('keystore.properties')
def keystoreProps = new Properties()
if (keystorePropsFile.exists()) {
    keystoreProps.load(new FileInputStream(keystorePropsFile))
}
def hasReleaseKey = keystorePropsFile.exists() && keystoreProps['storeFile']

android {
    signingConfigs {
        if (hasReleaseKey) {
            release {
                storeFile file(keystoreProps['storeFile'])
                storePassword keystoreProps['storePassword']
                keyAlias keystoreProps['keyAlias']
                keyPassword keystoreProps['keyPassword']
            }
        }
    }

    namespace 'com.jikegang.lightmeter'
    compileSdk 34

    defaultConfig {
        applicationId "com.jikegang.lightmeter"
        minSdk 21
        targetSdk 34
        versionCode 1
        versionName "1.0"
    }

    buildTypes {
        release {
            minifyEnabled true
            shrinkResources true
            proguardFiles getDefaultProguardFile('proguard-android-optimize.txt'), 'proguard-rules.pro'
            // 有 release 密钥就用它；没有则退回 debug（仅够本地安装，不能上架）
            signingConfig hasReleaseKey ? signingConfigs.release : signingConfigs.debug
        }
        debug {
            applicationIdSuffix '.debug'
            versionNameSuffix '-debug'
        }
    }

    compileOptions {
        sourceCompatibility JavaVersion.VERSION_17
        targetCompatibility JavaVersion.VERSION_17
        // 源码里大量中文注释。中文 Windows 上 javac 默认按 GBK 解码，
        // 遇到 UTF-8 汉字直接报 "编码 GBK 的不可映射字符"，
        // 而且报的行号看着完全正常，很难联想到编码问题。
        // 这里显式声明，不依赖 gradle.properties 里的 -Dfile.encoding。
        encoding = 'UTF-8'
    }
}

dependencies {
    implementation 'androidx.appcompat:appcompat:1.6.1'
    implementation 'com.google.android.material:material:1.11.0'
    implementation 'androidx.constraintlayout:constraintlayout:2.1.4'

    // 本地单测（JVM 上跑，不需要设备）
    testImplementation 'junit:junit:4.13.2'
    // android.jar 里的 org.json 是空壳（方法体全是 throw），
    // 本地单测一调就 UnsupportedOperationException。
    // 加这份纯 Java 实现作为测试期替代，逻辑与 Android 内置的一致。
    testImplementation 'org.json:json:20240303'
}